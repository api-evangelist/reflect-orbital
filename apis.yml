name: Reflect Orbital
description: 'Reflect Orbital is a space-technology company developing satellite-based
  infrastructure to redirect natural sunlight to precise locations on Earth. It offers
  a Lighting service (adjustable illumination from moonlight to full-daylight intensity,
  controllable via app or website with no ground infrastructure) and an Energy service
  (augmenting solar-farm output by directing concentrated sunlight onto photovoltaic
  arrays). The company plans to expand its constellation from 2 satellites in 2026 toward
  50,000+ by 2035. Reflect Orbital is backed by Lux Capital and was added to the API
  Evangelist network as a portfolio-sourced company profile. As of this enrichment pass
  the company publishes no public API, developer portal, documentation, SDKs, pricing,
  or sign-up surface.'
